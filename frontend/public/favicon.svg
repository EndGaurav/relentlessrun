<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#0b191e"/>
      <stop offset="100%" stop-color="#061014"/>
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Peak Line Gradient (Teal to Blue) -->
    <linearGradient id="peakGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Sun Halo -->
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="105" fill="url(#bgGrad)" />

  <!-- Outer Sun Glow -->
  <circle cx="340" cy="180" r="100" fill="url(#sunHalo)" />
  <circle cx="340" cy="180" r="80" fill="#ffffff" fill-opacity="0.04" />

  <!-- Sun -->
  <circle cx="340" cy="180" r="55" fill="url(#sunGrad)" />

  <!-- Sleek Peak -->
  <path d="M 100 400 L 260 120 L 420 400 Z" fill="url(#peakGrad)" fill-opacity="0.06" />
  <path d="M 100 400 L 260 120 L 420 400" 
        stroke="url(#peakGrad)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Dynamic Ascending Trail -->
  <path d="M 60 360 C 180 360, 200 220, 260 220 C 320 220, 340 320, 460 280" 
        stroke="url(#peakGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        opacity="0.9" />
</svg>
