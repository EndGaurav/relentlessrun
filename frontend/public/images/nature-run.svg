<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="natureSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="35%" stop-color="#082f49" />
      <stop offset="70%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <radialGradient id="natureSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0" />
    </radialGradient>

    <filter id="natureGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="800" height="600" fill="url(#natureSky)" />
  <circle cx="400" cy="280" r="220" fill="url(#natureSun)" filter="url(#natureGlow)" />
  <circle cx="400" cy="260" r="50" fill="#fffbeb" filter="url(#natureGlow)" />

  <!-- Alpine Lake & Mirror Reflection in Valley -->
  <!-- Mountain Slopes -->
  <polygon points="0,380 160,260 320,340 480,220 640,320 800,240 800,600 0,600" fill="#0f172a" opacity="0.8" />
  
  <!-- Valley Basin / Alpine Lake -->
  <ellipse cx="400" cy="460" rx="360" ry="80" fill="#083344" stroke="#06b6d4" stroke-width="1.5" opacity="0.9" />
  <ellipse cx="400" cy="460" rx="260" ry="50" fill="#0e7490" opacity="0.6" filter="url(#natureGlow)" />

  <!-- Foreground Shoreline Trail -->
  <polygon points="0,520 220,470 420,510 620,460 800,500 800,600 0,600" fill="#030712" />

  <!-- Luminous Trail Path Around Lake -->
  <path d="M 60,560 Q 240,490 420,510 T 620,460 T 750,490" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" filter="url(#natureGlow)" />

  <!-- Runner Running Along Shoreline Trail -->
  <g transform="translate(420, 505)">
    <ellipse cx="0" cy="0" rx="22" ry="4" fill="#000" opacity="0.5" />
    <circle cx="10" cy="-48" r="6.5" fill="#ffffff" />
    <path d="M 4,-40 L 14,-38 L 8,-10 L 0,-12 Z" fill="#ffffff" />
    <path d="M 10,-35 L 24,-24 L 32,-32" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 2,-34 L -10,-22 L -16,-12" fill="none" stroke="#67e8f9" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 8,-10 L 20,12 L 32,38" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <path d="M 0,-12 L -14,8 L -26,22" fill="none" stroke="#67e8f9" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Nature Badge Top Left -->
  <g transform="translate(40, 40)" filter="url(#natureGlow)">
    <rect width="130" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1.2" />
    <circle cx="18" cy="16" r="4" fill="#06b6d4" />
    <text x="32" y="21" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">NATURE</text>
  </g>
</svg>
