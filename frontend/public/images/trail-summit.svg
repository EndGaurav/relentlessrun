<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="trailSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="40%" stop-color="#064e3b" />
      <stop offset="80%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <radialGradient id="mistGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0" />
    </radialGradient>

    <filter id="trailGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="800" height="600" fill="url(#trailSky)" />
  <circle cx="400" cy="300" r="260" fill="url(#mistGlow)" />

  <!-- Alpine Pine Tree Layers & Mountain Slopes -->
  <!-- Distant Peak -->
  <polygon points="0,340 180,220 360,300 500,180 660,280 800,210 800,600 0,600" fill="#064e3b" opacity="0.6" />

  <!-- Mid Pine Ridge -->
  <polygon points="0,420 140,330 300,390 460,300 620,380 760,320 800,360 800,600 0,600" fill="#062e24" />

  <!-- Stylized Vector Pine Trees -->
  <g fill="#021f18">
    <polygon points="120,380 100,430 140,430" />
    <polygon points="160,360 140,420 180,420" />
    <polygon points="280,390 260,450 300,450" />
    <polygon points="600,370 580,440 620,440" />
    <polygon points="680,350 660,420 700,420" />
    <polygon points="740,360 720,430 760,430" />
  </g>

  <!-- Rocky Foreground Trail -->
  <polygon points="0,500 180,440 360,480 520,410 700,470 800,430 800,600 0,600" fill="#011410" />

  <!-- Switchback Trail Path (Neon Emerald) -->
  <path d="M 50,560 L 220,530 L 140,490 L 380,460 L 520,410 L 640,440 L 760,420" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#trailGlow)" />

  <!-- Trail Runner Climbing the Switchback -->
  <g transform="translate(520, 405)">
    <ellipse cx="0" cy="0" rx="20" ry="4" fill="#000" opacity="0.4" />
    <!-- Running Figure with Trekking Poles / Trail Power Hike -->
    <circle cx="8" cy="-48" r="6.5" fill="#ffffff" />
    <path d="M 2,-40 L 12,-38 L 6,-10 L -2,-12 Z" fill="#ffffff" />
    <path d="M 6,-35 L 20,-24 L 28,-32" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <path d="M 0,-34 L -12,-22 L -18,-12" fill="none" stroke="#a7f3d0" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 6,-10 L 18,12 L 30,38" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <path d="M -2,-12 L -16,8 L -28,22" fill="none" stroke="#a7f3d0" stroke-width="4.5" stroke-linecap="round" />
    <!-- Trail Running Pole -->
    <line x1="28" y1="-32" x2="35" y2="38" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Trail Badge Top Left -->
  <g transform="translate(40, 40)" filter="url(#trailGlow)">
    <rect width="140" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2" />
    <circle cx="18" cy="16" r="4" fill="#10b981" />
    <text x="32" y="21" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">TRAIL RUN</text>
  </g>
</svg>
