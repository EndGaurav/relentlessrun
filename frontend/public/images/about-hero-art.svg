<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Rich Alpine Aurora Gradient -->
    <linearGradient id="abHeroSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="30%" stop-color="#0f172a" />
      <stop offset="65%" stop-color="#064e3b" />
      <stop offset="90%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <radialGradient id="sunBurst" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <filter id="abGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowHeavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="800" height="600" fill="url(#abHeroSky)" />

  <!-- Sun Rays & Glow -->
  <circle cx="400" cy="260" r="240" fill="url(#sunBurst)" filter="url(#glowHeavy)" />
  <circle cx="400" cy="240" r="55" fill="#fffbeb" filter="url(#abGlow)" />

  <!-- Geometric Mountain Backdrop -->
  <!-- Far Range -->
  <polygon points="0,360 120,280 260,330 400,220 540,320 680,270 800,340 800,600 0,600" fill="#0f172a" opacity="0.85" />
  
  <!-- Snow Peaks -->
  <polygon points="400,220 375,255 390,260 400,248 412,262 425,255" fill="#f8fafc" opacity="0.9" />
  <polygon points="120,280 100,305 115,310 122,300 135,312 142,305" fill="#e2e8f0" opacity="0.8" />
  <polygon points="680,270 660,295 675,302 682,290 695,304 702,296" fill="#e2e8f0" opacity="0.8" />

  <!-- Mid Ridge Line -->
  <polygon points="0,430 160,350 320,400 480,320 640,390 800,330 800,600 0,600" fill="#062e28" />
  <polyline points="0,430 160,350 320,400 480,320 640,390 800,330" stroke="#34d399" stroke-width="2" fill="none" opacity="0.4" />

  <!-- Glowing Elevation Contour Waves -->
  <path d="M -20,460 Q 200,400 400,430 T 820,410" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 8" />
  <path d="M -20,500 Q 220,440 420,470 T 820,450" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 6" />

  <!-- Foreground Alpine Summit -->
  <polygon points="0,520 200,460 380,500 400,430 520,480 680,450 800,510 800,600 0,600" fill="#021f1a" />

  <!-- Illuminated Finish Line Arch on Summit -->
  <g filter="url(#abGlow)">
    <path d="M 280,450 Q 400,390 520,450" fill="none" stroke="url(#goldRibbon)" stroke-width="5" stroke-linecap="round" />
    <path d="M 300,458 Q 400,402 500,458" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Floating Victory Particles / Confetti -->
  <g opacity="0.9">
    <circle cx="330" cy="420" r="3" fill="#fde047" filter="url(#abGlow)" />
    <circle cx="470" cy="415" r="3.5" fill="#34d399" filter="url(#abGlow)" />
    <circle cx="360" cy="380" r="2.5" fill="#38bdf8" filter="url(#abGlow)" />
    <circle cx="440" cy="375" r="3" fill="#f472b6" filter="url(#abGlow)" />
    <circle cx="400" cy="360" r="2" fill="#fff" />
  </g>

  <!-- Runner Crossing Finish Line (Dynamic Vector Silhouette) -->
  <g transform="translate(400, 430)">
    <ellipse cx="0" cy="0" rx="36" ry="6" fill="#10b981" opacity="0.35" filter="url(#abGlow)" />
    <!-- Runner Silhouette Body -->
    <circle cx="0" cy="-68" r="8.5" fill="#ffffff" />
    <path d="M -10,-55 L 10,-55 L 7,-24 L -7,-24 Z" fill="#ffffff" />
    <!-- Victory Raised Arms -->
    <path d="M -9,-53 L -28,-76 L -22,-79 L -5,-53 Z" fill="#ffffff" />
    <path d="M 9,-53 L 28,-76 L 22,-79 L 5,-53 Z" fill="#ffffff" />
    <!-- Running Stride Legs -->
    <path d="M -7,-24 L -18,-2 L -12,0 L -2,-24 Z" fill="#ffffff" />
    <path d="M 7,-24 L 16,-6 L 22,-4 L 2,-24 Z" fill="#ffffff" />
    <!-- Luminous Energy Trail -->
    <path d="M -28,-76 L 0,-42 L 28,-76" fill="none" stroke="#10b981" stroke-width="2.5" filter="url(#abGlow)" />
  </g>

  <!-- GPS Glowing Telemetry Line Across Ridge -->
  <path d="M 120,550 L 260,510 L 400,480 L 540,510 L 680,540" fill="none" stroke="url(#neonGreen)" stroke-width="3" stroke-linecap="round" filter="url(#abGlow)" />
  <circle cx="400" cy="480" r="5" fill="#ffffff" stroke="#10b981" stroke-width="2.5" filter="url(#abGlow)" />

  <!-- Official Race Seal (Top Left Floating) -->
  <g transform="translate(40, 40)" filter="url(#abGlow)">
    <rect width="170" height="34" rx="17" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="34" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">VERIFIED FINISH</text>
  </g>

  <!-- GPS Elevation Telemetry (Top Right Floating) -->
  <g transform="translate(600, 40)" filter="url(#abGlow)">
    <rect width="160" height="34" rx="17" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
    <text x="80" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">PAN-INDIA RUN</text>
  </g>
</svg>
