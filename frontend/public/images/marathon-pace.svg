<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="marathonSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="75%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="marathonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="maraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="800" height="600" fill="url(#marathonSky)" />

  <!-- City & Mountain Horizon Blend -->
  <g opacity="0.4" fill="#0f172a">
    <!-- Mountain in Background -->
    <polygon points="0,320 180,240 360,300 540,210 720,280 800,230 800,600 0,600" />
    <!-- City Skyline Silhouettes in Mid-ground -->
    <rect x="80" y="280" width="30" height="150" />
    <rect x="120" y="250" width="45" height="180" />
    <rect x="220" y="290" width="35" height="140" />
    <rect x="420" y="270" width="40" height="160" />
    <rect x="520" y="240" width="50" height="190" />
    <rect x="640" y="280" width="35" height="150" />
  </g>

  <!-- Marathon Highway Perspective Grid -->
  <polygon points="100,600 370,360 430,360 700,600" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <line x1="400" y1="360" x2="400" y2="600" stroke="#38bdf8" stroke-width="3" stroke-dasharray="24 16" filter="url(#maraGlow)" />

  <!-- Marathon Speed & Pacing Waves -->
  <g filter="url(#maraGlow)">
    <path d="M 50,480 Q 200,420 400,450 T 750,430" fill="none" stroke="url(#marathonLine)" stroke-width="3.5" />
    <path d="M 30,520 Q 220,460 420,490 T 770,470" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.7" />
  </g>

  <!-- Marathoner in Mid-Stride (Athletic Runner Silhouette) -->
  <g transform="translate(400, 420)">
    <ellipse cx="0" cy="70" rx="28" ry="6" fill="#000" opacity="0.4" />
    <circle cx="18" cy="-52" r="8.5" fill="#ffffff" />
    <path d="M 8,-42 L 22,-38 L 5,6 L -7,3 Z" fill="#ffffff" />
    <!-- Arms -->
    <path d="M 18,-35 L 34,-20 L 44,-34" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 6,-33 L -12,-18 L -22,-6" fill="none" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Legs in Marathon Cadence -->
    <path d="M 4,6 L 24,32 L 40,68" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -5,4 L -25,34 L -42,54" fill="none" stroke="#cbd5e1" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Luminous Energy Ribbon -->
    <path d="M -42,54 L -25,34 L 4,6 L 24,32 L 40,68" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#maraGlow)" />
  </g>

  <!-- Split Time Badge Top Left -->
  <g transform="translate(40, 40)" filter="url(#maraGlow)">
    <rect width="160" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="16" r="4" fill="#38bdf8" />
    <text x="32" y="21" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">MARATHON SPLIT</text>
  </g>

  <!-- Distance Goal Top Right -->
  <g transform="translate(620, 40)" filter="url(#maraGlow)">
    <rect width="140" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" />
    <text x="70" y="21" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">42.2 KM · 21.1 KM</text>
  </g>
</svg>
