<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- RelentlessRun Primary Gradient -->
    <linearGradient id="rr-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="rr-glow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00d2ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Glow Backdrop -->
  <circle cx="32" cy="32" r="28" fill="url(#rr-grad)" opacity="0.1" />

  <!-- Relentless "R" Motion Slash 1 -->
  <path d="M14 12 H34 C44 12, 48 18, 48 26 C48 34, 42 38, 34 38 H24 V52 H14 V12 Z" fill="url(#rr-grad)" />
  
  <!-- Inner R Cutout -->
  <path d="M24 20 H33 C37 20, 39 22, 39 25 C39 28, 37 30, 33 30 H24 V20 Z" fill="#090d16" />

  <!-- Speed Forward Kick Leg of R -->
  <path d="M30 36 L46 52 H34 L22 36 H30 Z" fill="url(#rr-glow)" />

  <!-- Lightning Motion Slash Trail -->
  <path d="M42 14 L50 22 L38 34 L44 34 L32 50 L36 34 L30 34 L42 14 Z" fill="url(#rr-glow)" opacity="0.9" />
</svg>
